name: Build & Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0, latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  compute-version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -z "$latest" ]; then
            TAG="v1.0.0"
          else
            version="${latest#v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            minor=$((minor + 1))
            TAG="v${major}.${minor}.0"
          fi

          # If input release_tag provided via workflow_dispatch, override
          if [ "${{ github.event.inputs.release_tag }}" != "" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Computed version: $TAG"

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: compute-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            go_arch: amd64
          - os: linux
            arch: arm64
            go_arch: arm64
          - os: linux
            arch: armv7
            go_arch: arm
          - os: linux
            arch: 386
            go_arch: 386
          - os: windows
            arch: amd64
            go_arch: amd64
          - os: windows
            arch: 386
            go_arch: 386
          - os: darwin
            arch: arm64
            go_arch: arm64
          - os: darwin
            arch: amd64
            go_arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Build frontend
        run: |
          pnpm install
          pnpm --filter octopus build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ needs.compute-version.outputs.tag }}

      - name: Move frontend output
        run: |
          rm -rf static/out
          mkdir -p static/out
          cp -r web/out/* static/out/

      - name: Update price
        run: python3 scripts/updatePrice.py

      - name: Fix go.mod for CI
        run: |
          if [ ! -d "../axonhub" ]; then
            git clone --depth 1 https://github.com/looplj/axonhub.git ../axonhub
          else
            cd ../axonhub && git fetch --depth 1 origin master:master 2>/dev/null || true
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.go_arch }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go mod tidy
          COMMIT_ID=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%d %T%z')
          LDFLAGS="-X 'github.com/bestruirui/octopus/internal/conf.Version=${{ needs.compute-version.outputs.tag }}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Author=github-actions' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Commit=${COMMIT_ID}' \
                   -s -w"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          OUTPUT="octopus-${GOOS}-${TARGET_ARCH}${EXT}"
          go build -ldflags="${LDFLAGS}" -tags=jsoniter -o "${OUTPUT}" ./
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_ENV
          echo "EXT=${EXT}" >> $GITHUB_ENV

      - name: Generate checksum
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          md5sum "octopus-${TARGET_OS}-${TARGET_ARCH}${EXT}" > "octopus-${TARGET_OS}-${TARGET_ARCH}.md5"
          cat "octopus-${TARGET_OS}-${TARGET_ARCH}.md5"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: octopus-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            octopus-${{ matrix.os }}-${{ matrix.arch }}${{ env.EXT }}
            octopus-${{ matrix.os }}-${{ matrix.arch }}.md5
          retention-days: 90

  release:
    name: Create Release
    needs: [compute-version, build]
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums summary
        id: checksums
        run: |
          {
            echo '```'
            echo '| File | MD5 |'
            echo '|------|-----|'
            for md5_file in artifacts/octopus-*.md5; do
              if [ -f "$md5_file" ]; then
                name=$(basename "$md5_file" .md5)
                md5=$(awk '{print $1}' "$md5_file")
                echo "| \`${name}\` | \`${md5}\` |"
              fi
            done
            echo '```'
          } > checksums.md

          {
            echo "## Downloads"
            echo ""
            echo "**Version:** \`${{ needs.compute-version.outputs.tag }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Build time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "### Binaries"
            echo ""
            echo '```'
            echo '| File | MD5 |'
            echo '|------|-----|'
            for md5_file in artifacts/octopus-*.md5; do
              if [ -f "$md5_file" ]; then
                name=$(basename "$md5_file" .md5)
                md5=$(awk '{print $1}' "$md5_file")
                echo "| \`${name}\` | \`${md5}\` |"
              fi
            done
            echo '```'
            echo ""
            echo "## Checksums"
            echo '```'
            cat artifacts/octopus-*.md5
            echo '```'
          } > release_body.md

          echo "body_path=release_body.md" >> "$GITHUB_OUTPUT"

      - name: Create Tag and Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-version.outputs.tag }}
          name: Release ${{ needs.compute-version.outputs.tag }}
          body_path: ${{ steps.checksums.outputs.body_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        run: |
          RELEASE_ID=${{ steps.create_release.outputs.id }}
          for f in artifacts/octopus*; do
            name=$(basename "$f")
            if [ "$name" != "md5.txt" ]; then
              echo "Uploading $name..."
              curl -s -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
                --data-binary "@${f}" \
                | jq -r '.browser_download_url // .message // empty'
            fi
          done
          echo "All assets uploaded"

  update-release-body:
    name: Update Release Body
    needs: [compute-version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update release with download links
        run: |
          RELEASE_ID=${{ needs.release.outputs.release_id }}
          echo "Release ID: ${RELEASE_ID}"

          ASSETS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets")

          NAMES=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".md5") | not) | .name')

          TABLE="## Downloads\n\n"
          TABLE+="**Version:** \`${{ needs.compute-version.outputs.tag }}\`  \n"
          TABLE+="**Commit:** \`${{ github.sha }}\`  \n"
          TABLE+="**Build:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')  \n\n"
          TABLE+="### Binaries\n\n"
          TABLE+="| OS | Arch | File | MD5 | Size |\n"
          TABLE+="|---|------|------|-----|------|\n"

          for name in $NAMES; do
            size=$(echo "$ASSETS" | jq -r ".[] | select(.name == \"$name\") | .size")
            size_human=$(numfmt --to=iec "$size" 2>/dev/null || echo "${size}B")
            ext="${name##*.}"
            case "$ext" in
              exe) os="Windows"; arch="${name%.exe}"; arch="${arch##*-}" ;;
              *) os=$(echo "$name" | cut -d- -f2); arch=$(echo "$name" | cut -d- -f3) ;;
            esac
            base="${name%.exe}"
            md5_file="artifacts/${base}.md5"
            if [ -f "$md5_file" ]; then
              md5=$(awk '{print $1}' "$md5_file")
            else
              md5="n/a"
            fi
            url=$(echo "$ASSETS" | jq -r ".[] | select(.name == \"$name\") | .browser_download_url")
            TABLE+="| $os | $arch | [${name}](${url}) | \`${md5}\` | ${size_human} |\n"
          done

          TABLE+="\n### Checksums\n\n"
          TABLE+="\`\`\`\n"
          if compgen -G "artifacts/octopus-*.md5" > /dev/null; then
            TABLE+="$(cat artifacts/octopus-*.md5)"
          else
            TABLE+="# No checksums available"
          fi
          TABLE+="\n\`\`\`\n"

          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -d "$(jq -n --arg body "$TABLE" '{body: $body}')" \
            | jq -r '.html_url // .message // "Updated"'

          echo "Done!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
